<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bifurcate · 能力测试追溯</title>
  <style>
    :root{--bg:#09100e;--panel:#111b18;--panel2:#17231f;--line:#294139;--text:#eef7f2;--muted:#91a89f;--green:#71e6a7;--cyan:#72d5e8;--amber:#f6c76e;--red:#ff8d8d;--radius:18px}
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 80% -10%,#193e32 0,transparent 34%),var(--bg);color:var(--text);font:14px/1.55 ui-sans-serif,system-ui,-apple-system,"PingFang SC",sans-serif}
    button,select{font:inherit}.shell{max-width:1480px;margin:auto;padding:28px}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:24px}.eyebrow{color:var(--green);font-size:12px;letter-spacing:.16em;text-transform:uppercase}.top h1{font-size:34px;line-height:1.1;margin:7px 0}.top p{color:var(--muted);margin:0;max-width:720px}.actions{display:flex;gap:10px;align-items:center}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:12px;padding:10px 15px;cursor:pointer}.btn.primary{background:var(--green);color:#07110d;border-color:var(--green);font-weight:700}.btn:disabled{opacity:.5;cursor:wait}.layout{display:grid;grid-template-columns:300px 1fr;gap:18px}.card{background:linear-gradient(145deg,rgba(23,35,31,.96),rgba(14,24,21,.96));border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 18px 50px rgba(0,0,0,.18)}.sidebar{padding:15px;height:calc(100vh - 150px);position:sticky;top:20px;overflow:auto}.side-title{display:flex;justify-content:space-between;padding:7px 5px 13px;color:var(--muted)}.task{width:100%;text-align:left;background:transparent;border:1px solid transparent;color:var(--text);padding:12px;border-radius:12px;cursor:pointer;margin-bottom:7px}.task:hover,.task.active{background:#1c2c27;border-color:#35554a}.task strong,.task span{display:block}.task span{color:var(--muted);font-size:12px;margin-top:4px}.main{display:grid;gap:16px}.hero{padding:22px}.hero-head{display:flex;justify-content:space-between;gap:20px}.status{display:inline-flex;align-items:center;gap:7px;border:1px solid #38795d;background:#173c2d;color:var(--green);border-radius:999px;padding:5px 11px;font-weight:700}.status:before{content:"";width:7px;height:7px;background:currentColor;border-radius:50%}.hero h2{font-size:24px;margin:12px 0 4px}.ids{color:var(--muted);font-family:ui-monospace,SFMono-Regular,monospace}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:20px}.metric{background:rgba(6,14,11,.45);border:1px solid var(--line);border-radius:13px;padding:13px}.metric label{display:block;color:var(--muted);font-size:12px}.metric strong{display:block;margin-top:5px;font-size:16px;overflow-wrap:anywhere}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.section{padding:20px}.section h3{margin:0 0 15px;font-size:16px}.timeline{display:flex;overflow:auto;padding:4px 0 14px}.step{min-width:118px;position:relative;padding-top:25px;color:var(--muted)}.step:before{content:"";position:absolute;top:6px;left:0;width:12px;height:12px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px #173c2d}.step:after{content:"";position:absolute;top:11px;left:16px;width:calc(100% - 20px);height:2px;background:#315346}.step:last-child:after{display:none}.step strong{display:block;color:var(--text);font-size:12px}.step small{font-size:10px}.kv{display:grid;grid-template-columns:145px 1fr;gap:9px 14px}.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}.pill{display:inline-block;border:1px solid var(--line);background:#0e1916;border-radius:999px;padding:3px 8px;margin:2px;color:var(--cyan);font-size:12px}.chain{display:grid;gap:9px}.node{border-left:3px solid var(--cyan);background:#101c18;padding:11px 13px;border-radius:0 10px 10px 0}.node b,.node span{display:block}.node span{color:var(--muted);font-size:12px}.evidence{width:100%;border-collapse:collapse}.evidence th,.evidence td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.evidence th{color:var(--muted);font-size:11px;text-transform:uppercase}.mono{font-family:ui-monospace,SFMono-Regular,monospace;font-size:12px;overflow-wrap:anywhere}.artifacts{display:grid;gap:8px}.artifact{display:grid;grid-template-columns:1fr 2fr;gap:10px;padding:10px;border:1px solid var(--line);border-radius:10px}.empty{padding:60px;text-align:center;color:var(--muted)}.notice{color:var(--amber);font-size:12px;margin-top:8px}.error{color:var(--red)}@media(max-width:980px){.layout,.grid{grid-template-columns:1fr}.sidebar{height:auto;position:static}.metrics{grid-template-columns:1fr 1fr}.top{display:block}.actions{margin-top:16px}}
  </style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div><div class="eyebrow">Purpose → Claim → Binding → Evidence</div><h1>Bifurcate 能力测试追溯</h1><p>查看 Agent 从消息领取、资源申请和用途分化，到 Provider 绑定、成果交付与资源回收的完整证据链。</p></div>
    <div class="actions"><button class="btn" id="refresh">刷新</button><button class="btn primary" id="run">运行模拟 A2 测试</button></div>
  </header>
  <div class="layout">
    <aside class="card sidebar"><div class="side-title"><span>最近任务</span><span id="count">0</span></div><div id="tasks"></div></aside>
    <main class="main" id="main"><div class="card empty">尚无追溯记录。运行一次模拟 A2 测试开始。</div></main>
  </div>
</div>
<script>
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let views=[], selected='';
async function api(path,options={}){const r=await fetch(path,{headers:{'content-type':'application/json'},...options});if(!r.ok)throw new Error(await r.text());return r.json()}
function time(v){return v?new Date(v).toLocaleString('zh-CN',{hour12:false}):'—'}
function renderList(){ $('#count').textContent=views.length; $('#tasks').innerHTML=views.map(v=>`<button class="task ${v.task.taskId===selected?'active':''}" data-id="${esc(v.task.taskId)}"><strong>${esc(v.task.taskId)}</strong><span>${esc(v.task.status)} · ${time(v.task.updatedAt)}</span></button>`).join('')||'<div class="empty">暂无任务</div>'; document.querySelectorAll('.task').forEach(b=>b.onclick=()=>select(b.dataset.id)) }
async function load(){views=await api('/api/v1/tasks');if(!selected&&views[0])selected=views[0].task.taskId;renderList();if(selected)await select(selected)}
async function select(id){selected=id;renderList();const v=await api('/api/v1/tasks/'+encodeURIComponent(id));const lineage=v.bifurcation?await api('/api/v1/bifurcations/'+encodeURIComponent(v.bifurcation.id)+'/lineage'):null;render(v,lineage)}
function render(v,lineage){const t=v.task,i=v.resource_intent,b=v.bifurcation,result=t.result||{};const simulation=v.evidence.some(e=>e.details?.simulation);$('#main').innerHTML=`
  <section class="card hero"><div class="hero-head"><div><span class="status">${esc(t.status)}</span><h2>${esc(t.taskId)}</h2><div class="ids">${esc(t.traceId)}</div></div><div>${simulation?'<div class="notice">SIMULATION · Provider 与模型调用为模拟证据</div>':'<div class="status">LIVE EVIDENCE</div>'}</div></div>
  <div class="metrics"><div class="metric"><label>Agent</label><strong>${esc(t.claimedBy||t.recipient)}</strong></div><div class="metric"><label>审批</label><strong>${esc(i?.policy_decision?.effect||'—')}</strong></div><div class="metric"><label>Sandbox Claim</label><strong>${esc(b?.sandbox_claim_class||'—')}</strong></div><div class="metric"><label>证据数量</label><strong>${v.evidence.length}</strong></div></div></section>
  <section class="card section"><h3>任务状态时间线</h3><div class="timeline">${v.events.map(e=>`<div class="step"><strong>${esc(e.targetStatus)}</strong><small>${time(e.created_at)}</small></div>`).join('')}</div></section>
  <div class="grid"><section class="card section"><h3>消息与用途</h3><dl class="kv"><dt>Message ID</dt><dd class="mono">${esc(v.message.messageId)}</dd><dt>发送者 → 接收者</dt><dd>${esc(v.message.sender)} → ${esc(v.message.recipient)}</dd><dt>消息内容</dt><dd>${esc(v.message.parts?.[0]?.content)}</dd><dt>资源用途</dt><dd>${esc(i?.purpose||'—')}</dd><dt>策略版本</dt><dd>${esc(i?.policy_decision?.policy_version||'—')}</dd><dt>审批理由</dt><dd>${esc((i?.policy_decision?.reasons||[]).join('；'))}</dd></dl></section>
  <section class="card section"><h3>Claim 与 Provider Binding</h3><dl class="kv"><dt>Bifurcation</dt><dd class="mono">${esc(b?.id||'—')}</dd><dt>Claim Class</dt><dd>${esc(b?.sandbox_claim_class||'—')}</dd><dt>Claim Backend</dt><dd>${esc(b?.sandbox_backend||'—')}</dd><dt>Provider Binding</dt><dd class="mono">${esc(b?.sandbox_provider_ref||'等待绑定')}</dd><dt>Model Route</dt><dd>${esc(b?.model_gateway||'—')} / ${esc(b?.model_alias||'—')}</dd><dt>TTL</dt><dd>${esc(b?.ttl_minutes||'—')} 分钟</dd></dl></section></div>
  <div class="grid"><section class="card section"><h3>资源分化依赖链</h3><div class="chain">${(lineage?.resources||[]).map(r=>`<div class="node"><b>${esc(r.name)}</b><span>${esc(r.kind)} · ${esc(r.stage)} · ${(r.capabilities||[]).map(c=>`<i class="pill">${esc(c)}</i>`).join('')}</span></div>`).join('')||'—'}</div></section>
  <section class="card section"><h3>交付成果</h3><div class="artifacts">${(result.artifactUris||[]).map(uri=>{const n=uri.split('/').pop();return`<div class="artifact"><b>${esc(n)}</b><span class="mono">${esc(result.checksums?.[n]||'—')}</span></div>`}).join('')||'暂无成果'}</div><p class="notice">${esc(result.summary||'')}</p></section></div>
  <section class="card section"><h3>实体证据与反向追溯</h3><table class="evidence"><thead><tr><th>实体类型</th><th>实体引用</th><th>关系</th><th>观测时间</th></tr></thead><tbody>${v.evidence.map(e=>`<tr><td>${esc(e.entityType)}</td><td class="mono">${esc(e.entityRef)}</td><td>${esc(e.relation)}</td><td>${time(e.observed_at)}</td></tr>`).join('')}</tbody></table></section>`}
$('#refresh').onclick=()=>load().catch(showError);$('#run').onclick=async()=>{const b=$('#run');b.disabled=true;b.textContent='运行中…';try{const v=await api('/api/v1/capability-tests/simulated-a2',{method:'POST'});selected=v.task.taskId;await load()}catch(e){showError(e)}finally{b.disabled=false;b.textContent='运行模拟 A2 测试'}};
function showError(e){$('#main').innerHTML=`<div class="card empty error">${esc(e.message||e)}</div>`}load().catch(showError);
</script>
</body></html>
