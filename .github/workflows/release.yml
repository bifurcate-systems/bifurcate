name: Release OCI image and Helm chart

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Validate release source and version
        shell: bash
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          version="${GITHUB_REF_NAME#v}"
          test "${GITHUB_REF_NAME}" = "v${version}"
          test "$(sed -n 's/^version: //p' charts/bifurcate/Chart.yaml)" = "${version}"
          test "$(sed -n 's/^  tag: //p' charts/bifurcate/values.yaml | tr -d '"')" = "${GITHUB_REF_NAME}"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: image
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/bifurcate-systems/bifurcate:${{ github.ref_name }}
          provenance: mode=max
          sbom: true
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Publish and sign image and chart
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          image="ghcr.io/bifurcate-systems/bifurcate@${IMAGE_DIGEST}"
          cosign sign --yes "${image}"
          helm lint charts/bifurcate
          helm package charts/bifurcate --destination dist
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm push "dist/bifurcate-${version}.tgz" oci://ghcr.io/bifurcate-systems/charts
          cosign sign --yes "ghcr.io/bifurcate-systems/charts/bifurcate:${version}"
          cosign sign-blob --yes --bundle "dist/bifurcate-${version}.tgz.bundle.json" "dist/bifurcate-${version}.tgz"
          sha256sum "dist/bifurcate-${version}.tgz" > "dist/bifurcate-${version}.tgz.sha256"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes
